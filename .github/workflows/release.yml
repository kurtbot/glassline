name: Release

# Tag-triggered release build.
#
# Push a tag like `v0.5.1` to:
#   1. Draft a GitHub Release (create-release).
#   2. Build glassline for 5 targets and attach archives (upload-assets).
#   3. Compute SHA256SUMS.txt, attach it to the Release, and auto-commit
#      the updated Homebrew Formula/glassline.rb back to main (finalize).
#
# Local flow:
#   git tag v0.5.1 -m "0.5.1"
#   git push origin v0.5.1
#
# The finalize commit message includes `[skip ci]` so it doesn't
# re-trigger the CI workflow.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Publish immediately so users can download binaries without
          # the maintainer having to click "Publish" on a draft. Release
          # notes can still be edited post-hoc via the GitHub UI.
          draft: false

  upload-assets:
    name: Build ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          # Whitespace-separated multi-bin: both the render binary and
          # the interactive editor ship in one archive so the TTY shim
          # (bare `glassline` in a terminal → exec sibling `glassline-tui`)
          # can find its neighbour on any install path.
          bin: glassline glassline-tui
          target: ${{ matrix.target }}
          include: LICENSE,LICENSE-UPSTREAM,README.md
          archive: glassline-$target
          token: ${{ secrets.GITHUB_TOKEN }}

  finalize:
    name: Checksums + Homebrew formula
    needs: upload-assets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main (with write token)
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract version from tag
        id: ver
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download all release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/archives
          cd /tmp/archives
          gh release download "${{ steps.ver.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'glassline-*.tar.gz' \
            --pattern 'glassline-*.zip'
          ls -la

      - name: Compute SHA256SUMS.txt
        run: |
          cd /tmp/archives
          sha256sum glassline-*.tar.gz glassline-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.ver.outputs.tag }}" \
            /tmp/archives/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Update Homebrew formula
        run: |
          version="${{ steps.ver.outputs.version }}"
          # Extract per-target SHA256s.
          sha_mac_arm=$(grep '  glassline-aarch64-apple-darwin\.tar\.gz$' /tmp/archives/SHA256SUMS.txt | awk '{print $1}')
          sha_mac_x64=$(grep '  glassline-x86_64-apple-darwin\.tar\.gz$'   /tmp/archives/SHA256SUMS.txt | awk '{print $1}')
          sha_lin_arm=$(grep '  glassline-aarch64-unknown-linux-gnu\.tar\.gz$' /tmp/archives/SHA256SUMS.txt | awk '{print $1}')
          sha_lin_x64=$(grep '  glassline-x86_64-unknown-linux-gnu\.tar\.gz$'   /tmp/archives/SHA256SUMS.txt | awk '{print $1}')

          for s in "$sha_mac_arm" "$sha_mac_x64" "$sha_lin_arm" "$sha_lin_x64"; do
            if [ -z "$s" ]; then
              echo "missing SHA256 line — SHA256SUMS.txt contents:"
              cat /tmp/archives/SHA256SUMS.txt
              exit 1
            fi
          done

          # Rewrite version + download URL versions + placeholders.
          # The formula is regular text; sed handles it fine.
          sed -i \
            -e "s|version \".*\"|version \"${version}\"|" \
            -e "s|/download/v[0-9]\+\.[0-9]\+\.[0-9]\+/|/download/v${version}/|g" \
            Formula/glassline.rb

          # Substitute the four per-arch sha256 values.
          #
          # Prior implementation used block regexes like
          # `on_macos.*?on_intel.*?end` and re.sub with count=1 on the
          # matched block. That silently miscompiled: the `on_intel`
          # block regex's span STARTS at `on_macos do`, so it includes
          # the earlier on_arm block. `count=1` then hits the arm sha
          # (first in the span) and overwrites it with the intel value,
          # while the actual on_intel `sha256 "PLACEHOLDER_*"` line
          # never gets touched. Bug latent since v0.5.1 — first
          # surfaced in v0.7.0 verification.
          #
          # New approach: anchor on the URL's arch fragment (which is
          # globally unique in the file) and rewrite the sha256 that
          # immediately follows it. No cross-block interference.
          python3 - <<PY
          import re, pathlib
          path = pathlib.Path("Formula/glassline.rb")
          text = path.read_text()

          def swap_by_url_arch(arch_fragment, new_sha):
              # Match: url "...<arch_fragment>..." + newline+ws + sha256 "OLD"
              # Rewrite only the sha256 that pairs with the target URL.
              pattern = re.compile(
                  r'(url "[^"]*' + re.escape(arch_fragment) + r'[^"]*"\s+sha256 ")[^"]*(")',
                  re.DOTALL,
              )
              new_text, n = pattern.subn(rf'\g<1>{new_sha}\g<2>', text, count=1)
              if n == 0:
                  raise SystemExit(f"couldn't find sha256 slot for {arch_fragment}")
              return new_text

          text = swap_by_url_arch("aarch64-apple-darwin",         "${sha_mac_arm}")
          text = swap_by_url_arch("x86_64-apple-darwin",          "${sha_mac_x64}")
          text = swap_by_url_arch("aarch64-unknown-linux-gnu",    "${sha_lin_arm}")
          text = swap_by_url_arch("x86_64-unknown-linux-gnu",     "${sha_lin_x64}")

          path.write_text(text)
          PY

          cat Formula/glassline.rb

      - name: Commit + push formula update
        run: |
          git config user.name  "kurtbot-release"
          git config user.email "kurtbot@users.noreply.github.com"
          if git diff --quiet Formula/glassline.rb; then
            echo "no changes to formula — nothing to commit"
            exit 0
          fi
          git add Formula/glassline.rb
          git commit -m "chore(release): update Homebrew formula for ${{ steps.ver.outputs.tag }} [skip ci]"
          git push origin HEAD:main
