[package]
name = "glassline-widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Built-in widget implementations for glassline."
publish = false

[lints]
workspace = true

[dependencies]
glassline-core = { path = "../glassline-core" }
phf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true, optional = true }
time = { workspace = true }
wait-timeout = { workspace = true }

[features]
default = ["sysinfo-widgets"]
# Enables the `free-memory` widget. Opt out with
# `--no-default-features` to save ~500KB in the release binary and drop
# the sysinfo dep.
sysinfo-widgets = ["dep:sysinfo"]

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
