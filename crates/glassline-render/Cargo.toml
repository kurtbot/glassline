[package]
name = "glassline-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Hot-path binary for glassline — reads a StatusJSON payload on stdin and writes an ANSI status line to stdout."
publish = false
default-run = "glassline"

# `cargo binstall glassline-render --git https://github.com/kurtbot/glassline`
# fetches the matching release archive instead of source-compiling. The
# templating below tells cargo-binstall which archive to grab per target.
# We publish nothing to crates.io (publish = false), so users must use
# --git; the README documents this.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/glassline-{ target }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "glassline"
path = "src/main.rs"

[lib]
name = "glassline_render"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
glassline-core = { path = "../glassline-core" }
glassline-widgets = { path = "../glassline-widgets" }
fs2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
glassline-testkit = { path = "../glassline-testkit" }
